name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: 前端（类型检查 + 构建）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Vite 7 要求 Node 20.19+ / 22.12+；16/18 会在 crypto.hash 处直接失败
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      # npm run build = tsc && vite build
      - name: 构建前端
        run: npm run build

      # Rust 侧的 generate_context! 在编译期需要 dist/ 存在，传给下面两个平台
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  rust:
    name: Rust 单测（${{ matrix.os }}）
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # 仓库里没有提交 dist/，缺了它 lib.rs 的 generate_context! 会编译失败
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 单元测试
        working-directory: src-tauri
        run: cargo test --lib --locked
