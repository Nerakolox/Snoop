name: Build

# 构建与发布拆分（第一步）：只编译，不发布。
#
#   Build：校验版本号与更新日志 → macOS / Windows 并行构建 → 产出可验证的 Artifacts。
#          不连接雨云、不提交版本号、不打 tag、不建 Release。
#   Publish：用本工作流的 Run ID 下载产物，完成上传、提交、tag 和 Release。
#
# 这样雨云上传失败时，只需要用同一个 Build Run ID 重跑 Publish，
# 不用重新编译（见 publish.yml）。
#
# 触发：Actions → Build → Run workflow，填版本号。
# 产物（保留 30 天）：
#   macos-assets   Snoop_<版本>_aarch64.dmg
#   windows-assets Snoop_<版本>_x64-setup.exe
#   build-meta     build-meta.json + checksums.txt（版本号、构建 Commit SHA、文件名、大小、SHA256）

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（x.y.z，不带 v）"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: 校验版本
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 检查版本号与更新日志
        id: check
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::版本号必须是 x.y.z（不带 v）: $VERSION"
            exit 1
          fi

          # 产物要能和 main 的源码对上；Publish 也会校验 Build 的 commit 在 main 历史里。
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Build 只能从 main 触发（当前 $GITHUB_REF_NAME）"
            exit 1
          fi

          # 更新日志是应用内「这一版改了什么」的数据源；缺条目直接拦在构建前。
          node -e "const c=require('./src/changelog/changelog.json'); if(!c.releases.some(r=>r.version===process.env.VERSION)) { console.error('::error::src/changelog/changelog.json 里没有 '+process.env.VERSION+' 的条目'); process.exit(1) }"

          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "::error::v$VERSION 已经打过 tag，不能再用这个版本号构建。补发请直接用对应的 Build Run ID 重跑 Publish"
            exit 1
          fi

          CUR=$(node -p "require('./package.json').version")
          HIGHEST=$(git ls-remote --tags origin 'refs/tags/v*' \
            | sed -n 's#.*refs/tags/v##p' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1 || true)

          if [ "$CUR" = "$VERSION" ]; then
            echo "::error::main 上的版本号已经是 $VERSION，不需要再构建；若是补 tag，请直接重跑 Publish"
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$CUR" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "::error::版本号必须大于 main 上的当前版本 $CUR（收到 $VERSION）"
            exit 1
          fi
          if [ -n "$HIGHEST" ] && [ "$(printf '%s\n%s\n' "$HIGHEST" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "::error::版本号必须大于已发布的最新版本 v$HIGHEST（收到 $VERSION）"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-macos:
    name: 构建 macOS（aarch64）
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # 先只出 Apple Silicon 包：universal 体积翻倍，跨洋上传太慢。
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        run: npm ci --no-audit --no-fund

      # 只在本次构建的工作区里改版本号，提交由 Publish 统一做
      - name: 同步版本号
        run: node scripts/bump-version.mjs "${{ inputs.version }}"

      # 不配置任何签名环境变量，产物未签名（Apple / Windows 均不签）
      - name: 构建 aarch64 dmg
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: 收集产物
        run: |
          mkdir -p release-assets
          find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg \
            -maxdepth 1 -name '*.dmg' -exec cp {} release-assets/ \;
          ls -lh release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: release-assets/*.dmg
          if-no-files-found: error
          retention-days: 30
          # 重跑 Build 时覆盖上一次同名产物，避免 Publish 按 Run ID 下载到多份
          overwrite: true

  build-windows:
    name: 构建 Windows（x64）
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        run: npm ci --no-audit --no-fund

      - name: 同步版本号
        run: node scripts/bump-version.mjs "${{ inputs.version }}"

      - name: 构建 NSIS 安装包
        run: npm run tauri build

      - name: 收集产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release-assets/
          Get-ChildItem release-assets | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: release-assets/*.exe
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  # 汇总两个平台的产物，生成 Publish 用来做一致性校验的元数据。
  # 元数据也作为 Artifact 保存，30 天内可随时复查。
  meta:
    name: 汇总构建信息
    needs: [prepare, build-macos, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-assets'
          path: release-assets
          merge-multiple: true

      - name: 生成 build-meta.json 与 checksums.txt
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$(ls -A release-assets)" || { echo "::error::没有下载到任何构建产物"; exit 1; }

          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');

          const dir = 'release-assets';
          const assets = fs.readdirSync(dir).sort().map((name) => {
            const file = path.join(dir, name);
            return {
              name,
              size: fs.statSync(file).size,
              sha256: crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex'),
            };
          });

          const exe = assets.filter((a) => a.name.endsWith('.exe'));
          const dmg = assets.filter((a) => a.name.endsWith('.dmg'));
          if (assets.length !== 2 || exe.length !== 1 || dmg.length !== 1) {
            console.error(`::error::期望恰好 1 个 exe + 1 个 dmg，实际 ${assets.map((a) => a.name).join(', ') || '(空)'}`);
            process.exit(1);
          }
          for (const a of assets) {
            if (!a.name.includes(process.env.VERSION)) {
              console.error(`::error::产物文件名里没有版本号 ${process.env.VERSION}: ${a.name}`);
              process.exit(1);
            }
          }

          const meta = {
            version: process.env.VERSION,
            commit: process.env.GITHUB_SHA,
            ref: process.env.GITHUB_REF_NAME,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            assets,
          };

          fs.mkdirSync('build-meta', { recursive: true });
          fs.writeFileSync('build-meta/build-meta.json', JSON.stringify(meta, null, 2) + '\n');
          fs.writeFileSync(
            'build-meta/checksums.txt',
            assets.map((a) => `${a.sha256}  ${a.name}`).join('\n') + '\n',
          );

          for (const a of assets) {
            console.log(`${a.sha256}  ${a.name} (${a.size} bytes)`);
          }

          const summary = [
            '### Build 产物',
            '',
            '| 文件 | 大小 | SHA256 |',
            '| --- | --- | --- |',
            ...assets.map((a) => `| ${a.name} | ${a.size} | \`${a.sha256}\` |`),
            '',
            `版本号 \`${meta.version}\`，构建 Commit \`${meta.commit}\`，Run ID \`${meta.runId}\`（attempt ${meta.runAttempt}）。`,
            '',
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: build-meta
          path: build-meta/
          if-no-files-found: error
          retention-days: 30
          overwrite: true
