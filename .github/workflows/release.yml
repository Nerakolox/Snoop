name: Release

# 一键发版：在 Actions 页面点 Run workflow，填版本号和更新说明即可。
# 流程：校验版本 → macOS/Windows 并行构建（均不签名）→ 算 sha256 生成 latest.json
# → 先传 installer、最后传清单到雨云 S3 → 提交版本号、打 tag、建 GitHub Release。
#
# 需要的仓库配置（Settings → Secrets and variables → Actions）：
#   Secrets: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY（雨云 S3 的 AK/SK）
#            S3_ENDPOINT（区域端点，如 https://cn-nb1.rains3.com）
#            S3_BUCKET（如 snoop）
#   Variables（可选）: S3_REGION（默认 us-east-1）
#                      S3_ADDRESSING_STYLE（默认 virtual）

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（x.y.z，不带 v）"
        required: true
        type: string
      notes:
        description: "更新说明（写进 latest.json 和 GitHub Release，可留空）"
        required: false
        default: ""
        type: string
      dry_run:
        description: "试跑：只构建和生成清单，不上传 S3、不提交、不发 Release"
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: 校验版本
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag_exists: ${{ steps.check.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 检查版本号与 tag
        id: check
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::版本号必须是 x.y.z（不带 v）: $VERSION"
            exit 1
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "试跑模式：跳过版本递增与 tag 校验"
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::正式发版只能在 main 上运行（当前 $GITHUB_REF_NAME）"
            exit 1
          fi

          CUR=$(node -p "require('./package.json').version")

          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            HIGHEST=$(git ls-remote --tags origin 'refs/tags/v*' \
              | sed -n 's#.*refs/tags/v##p' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -1)
            if [ "$VERSION" != "$HIGHEST" ]; then
              echo "::error::v$VERSION 已存在且不是最新版本（最新 v$HIGHEST），不能重发"
              exit 1
            fi
            TAGVER=$(git show "v$VERSION:package.json" \
              | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
            if [ "$TAGVER" != "$VERSION" ]; then
              echo "::error::tag v$VERSION 里的 package.json 是 $TAGVER，和 tag 不一致"
              exit 1
            fi
            echo "::notice::v$VERSION 已发过，按重跑处理：跳过提交和打 tag"
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            HIGHER=$(printf '%s\n%s\n' "$CUR" "$VERSION" | sort -V | tail -1)
            if [ "$HIGHER" != "$VERSION" ] || [ "$VERSION" = "$CUR" ]; then
              echo "::error::版本号必须大于当前 $CUR（收到 $VERSION）。CD 会自己 bump，不要先手动改版本号；若版本号已提交但 tag 丢失，请手动补 tag 再重跑。"
              exit 1
            fi
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 更新日志是应用内「这一版改了什么」的数据源；缺条目时直接拦在发版前，
      # 免得升完级弹窗里找不到当前版本。
      - name: 检查更新日志包含本次版本
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e "const c=require('./src/changelog/changelog.json'); if(!c.releases.some(r=>r.version===process.env.VERSION)) { console.error('::error::src/changelog/changelog.json 里没有 '+process.env.VERSION+' 的条目'); process.exit(1) }"

  build-macos:
    name: 构建 macOS（aarch64）
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 重跑已存在的版本时，必须用当时 tag 的源码构建，
      # 否则同一个版本号可能发出两份不同的代码。
      - name: 重跑已有版本时检出对应 tag
        if: ${{ needs.prepare.outputs.tag_exists == 'true' }}
        shell: bash
        run: |
          git fetch --force origin "refs/tags/v${{ inputs.version }}:refs/tags/v${{ inputs.version }}"
          git checkout --force "v${{ inputs.version }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # 先只出 Apple Silicon 包：universal 体积翻倍，跨洋上传太慢。
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        run: npm ci --no-audit --no-fund

      # 只在本次构建的工作区里改版本号，提交由 publish 统一做
      - name: 同步版本号
        run: node scripts/bump-version.mjs "${{ inputs.version }}"

      # 不配置任何签名环境变量，产物未签名（Apple / Windows 均不签）
      - name: 构建 aarch64 dmg
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: 收集产物
        run: |
          mkdir -p release-assets
          find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg \
            -maxdepth 1 -name '*.dmg' -exec cp {} release-assets/ \;
          ls -lh release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: release-assets/*.dmg
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: 构建 Windows（x64）
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 重跑已存在的版本时，必须用当时 tag 的源码构建，
      # 否则同一个版本号可能发出两份不同的代码。
      - name: 重跑已有版本时检出对应 tag
        if: ${{ needs.prepare.outputs.tag_exists == 'true' }}
        shell: bash
        run: |
          git fetch --force origin "refs/tags/v${{ inputs.version }}:refs/tags/v${{ inputs.version }}"
          git checkout --force "v${{ inputs.version }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        run: npm ci --no-audit --no-fund

      - name: 同步版本号
        run: node scripts/bump-version.mjs "${{ inputs.version }}"

      - name: 构建 NSIS 安装包
        run: npm run tauri build

      - name: 收集产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release-assets/
          Get-ChildItem release-assets | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: release-assets/*.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 生成清单并发布
    needs: [prepare, build-macos, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
      DRY_RUN: ${{ inputs.dry_run }}
      TAG_EXISTS: ${{ needs.prepare.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          pattern: '*-assets'
          path: release-assets
          merge-multiple: true

      - name: 同步版本号
        run: node scripts/bump-version.mjs "$VERSION"

      - name: 生成 latest.json
        run: |
          MAC=$(ls release-assets/*.dmg | head -1)
          # 官网下载链路按 Snoop_<版本>_aarch64.dmg 取包。aarch64 构建本来
          # 就是这个命名，这里只在 Tauri 换了后缀时兜底改名。
          MAC_LEGACY="release-assets/Snoop_${VERSION}_aarch64.dmg"
          if [ "$MAC" != "$MAC_LEGACY" ]; then
            mv "$MAC" "$MAC_LEGACY"
          fi
          MAC="$MAC_LEGACY"
          WIN=$(ls release-assets/*.exe | head -1)
          node scripts/make-release-manifest.mjs \
            --version "$VERSION" \
            --notes "$NOTES" \
            --mac "$MAC" \
            --win "$WIN" \
            --out latest.json

      - name: 检查 S3 配置
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          : "${S3_ENDPOINT:?缺少仓库 Secret S3_ENDPOINT}"
          : "${S3_BUCKET:?缺少仓库 Secret S3_BUCKET}"
          : "${AWS_ACCESS_KEY_ID:?缺少仓库 Secret AWS_ACCESS_KEY_ID}"
          : "${AWS_SECRET_ACCESS_KEY:?缺少仓库 Secret AWS_SECRET_ACCESS_KEY}"

      - name: 配置 aws-cli
        if: ${{ !inputs.dry_run }}
        run: |
          aws --version
          aws configure set default.s3.addressing_style "${{ vars.S3_ADDRESSING_STYLE || 'virtual' }}"

      # 先把安装包传到桶里；latest.json 是客户端的更新开关，必须最后传。
      - name: 上传 installer 到雨云
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          for f in release-assets/*; do
            echo "上传 $(basename "$f")"
            aws s3 cp "$f" "s3://$S3_BUCKET/$(basename "$f")" \
              --endpoint-url "$S3_ENDPOINT" \
              --cache-control "public, max-age=31536000, immutable" \
              --only-show-errors
          done

      # 此时安装包已就位、清单还没换，再提交版本号并打 tag。
      # 这一步失败不会影响客户端（它们仍看到旧清单）；重跑时 tag 已存在会跳过，不会重复提交。
      - name: 提交版本号并打 tag
        if: ${{ !inputs.dry_run && needs.prepare.outputs.tag_exists != 'true' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): 发布 v$VERSION"
            git push origin HEAD:main
          fi
          git tag -a "v$VERSION" -m "v$VERSION" 2>/dev/null || true
          git push origin "refs/tags/v$VERSION"

      # 更新日志要在清单之前上线：客户端升级后第一屏就能读到这一版。
      - name: 上传更新日志到雨云
        if: ${{ !inputs.dry_run }}
        run: |
          aws s3 cp src/changelog/changelog.json "s3://$S3_BUCKET/changelog.json" \
            --endpoint-url "$S3_ENDPOINT" \
            --content-type "application/json" \
            --cache-control "public, max-age=60" \
            --only-show-errors

      # 最后传清单：这是原子的“上线开关”。
      - name: 最后上传 latest.json
        if: ${{ !inputs.dry_run }}
        run: |
          aws s3 cp latest.json "s3://$S3_BUCKET/latest.json" \
            --endpoint-url "$S3_ENDPOINT" \
            --content-type "application/json" \
            --cache-control "public, max-age=60" \
            --only-show-errors

      # 回读校验：清单内容一致、安装包大小一致，防止上传截断 / 写错桶。
      - name: 校验 S3 上的对象
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          aws s3 cp "s3://$S3_BUCKET/latest.json" uploaded-latest.json \
            --endpoint-url "$S3_ENDPOINT" \
            --only-show-errors
          diff -u latest.json uploaded-latest.json
          aws s3 cp "s3://$S3_BUCKET/changelog.json" uploaded-changelog.json \
            --endpoint-url "$S3_ENDPOINT" \
            --only-show-errors
          diff -u src/changelog/changelog.json uploaded-changelog.json
          for f in release-assets/*; do
            name=$(basename "$f")
            local_size=$(stat -c%s "$f")
            remote_size=$(aws s3api head-object \
              --bucket "$S3_BUCKET" --key "$name" \
              --endpoint-url "$S3_ENDPOINT" \
              --query ContentLength --output text)
            if [ "$local_size" != "$remote_size" ]; then
              echo "::error::$name 大小不一致：本地 $local_size / 远端 $remote_size"
              exit 1
            fi
            echo "✔ $name ($remote_size bytes)"
          done

      - name: 创建或更新 GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NOTES" > release-notes.md
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" release-assets/* latest.json --clobber
            if [ -n "$NOTES" ]; then
              gh release edit "v$VERSION" --notes-file release-notes.md
            fi
          elif [ -n "$NOTES" ]; then
            gh release create "v$VERSION" release-assets/* latest.json \
              --title "v$VERSION" --notes-file release-notes.md
          else
            gh release create "v$VERSION" release-assets/* latest.json \
              --title "v$VERSION" --generate-notes
          fi

      - name: 保留清单便于检查
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: latest.json
